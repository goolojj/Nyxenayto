name: Build NYX3N v4 JAR (1.21.11)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Auto-Unzip & Build NYX3N v4 JAR
        run: |
          BUILD_FILE=$(find . -maxdepth 4 -name 'build.gradle' | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            ZIP_FILE=$(find . -maxdepth 2 -name '*.zip' | head -n 1)
            if [ -n "$ZIP_FILE" ]; then
              mkdir -p mod_extracted
              unzip -o "$ZIP_FILE" -d mod_extracted
              BUILD_FILE=$(find mod_extracted -maxdepth 4 -name 'build.gradle' | head -n 1)
            fi
          fi
          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Repo mein na build.gradle mila na koi .zip file!"
            exit 1
          fi
          cd "$(dirname "$BUILD_FILE")"
          gradle build --no-daemon

      - name: Prepare Clean Versioned JAR
        run: |
          mkdir -p final_jar
          JAR_FILE=$(find . -path "*/build/libs/*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Compiled JAR not found!"
            exit 1
          fi
          cp "$JAR_FILE" final_jar/Nyx3n-v4-1.21.11.jar
          ls -lh final_jar/

      - name: Upload Clean JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nyx3n-v4-1.21.11
          path: final_jar/Nyx3n-v4-1.21.11.jar
